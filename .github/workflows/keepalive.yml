name: keepalive

# Supabase 免费项目 7 天不活跃会被暂停，这个任务每天打一次 API 维持活跃。
#
# 需要配置（Settings → Secrets and variables → Actions → Secrets）：
#   SUPABASE_URL        例：https://endwymjjxudepmtwmfpx.supabase.co
#   SUPABASE_ANON_KEY   例：sb_publishable_...（可公开，靠 RLS 兜底）
#
# 为什么打 /auth/v1/health 而不是 /rest/v1/：
#   实测 /rest/v1/ 根路径只接受 secret key，用 publishable key 会 401；
#   /auth/v1/health 带 apikey 头返回 200，最适合当探针。
#   注意：不带 apikey 头是 401，所以 header 不能省。

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00。GitHub 的 cron 可能延迟几分钟到一小时，无所谓。
    - cron: '0 1 * * *'
  workflow_dispatch:        # 支持手动点一下验证

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检查 secrets 是否配置
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::缺少 SUPABASE_URL 或 SUPABASE_ANON_KEY，请到 Settings → Secrets and variables → Actions 添加"
            exit 1
          fi

      - name: Ping Supabase
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $KEY" "$URL/auth/v1/health")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::保活请求失败，HTTP $code"
            exit 1
          fi
          echo "✅ 项目活跃状态已刷新"
