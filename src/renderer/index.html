<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>斯诺克走位教学</title>
    <!--
      CSP：图片与接口都要放行 Supabase（Storage 图片 + PostgREST/Auth），
      开发期还需 ws: 给 Vite HMR。改这里之前先想清楚会不会把远程图片挡掉。
      启动页诗句走 v1.jinrishici.com（T3.1），漏了这条 fetch 会被静默拦掉。

      img-src 必须带 blob: —— 表单选图后的本地预览用 `URL.createObjectURL()`
      生成 blob: 地址。少了它，`<img>` 会被拦成破图（只剩 alt 文本），
      控制台只有一条 CSP 报错，很容易被当成"预览不生效"去改组件。

      img-src 必须带 snooker-media: —— T5.1 起图片走主进程自定义协议
      （本地缓存命中就不下载），scheme 写错会整站图片全破。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: snooker-media: https://*.supabase.co; font-src 'self' data:; connect-src 'self' https://*.supabase.co https://poetry.palemoky.com ws: http://localhost:*"
    />
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
